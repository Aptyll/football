<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9e1b32">
<title>Prime Time Drive</title>
<style>
  :root{--crimson:#9e1b32;--ink:#fff;--bg:#04070f;--panel:#0e1524;--muted:#b9c0d4}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(120% 80% at 50% 0%,#2a0c14 0%,var(--bg) 60%);color:var(--ink);
    font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:420px;text-align:center}
  h1{font-size:40px;line-height:1;margin:0 0 8px;letter-spacing:.5px;text-transform:uppercase}
  p{color:var(--muted);margin:0 0 28px}
  a.btn{display:block;text-decoration:none;color:var(--ink);border-radius:16px;padding:20px 18px;margin:0 0 14px;text-align:left;
    background:var(--panel);border:1px solid #2a3555}
  a.btn.primary{background:var(--crimson);border-color:#c4304b}
  a.btn b{display:block;font-size:22px}
  a.btn span{color:#e7d6da;font-size:14px}
  a.btn:not(.primary) span{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Prime Time Drive</h1>
  <p>One drive to win it. Turn your phone sideways for the widest view.</p>
  <a class="btn primary" href="game.html"><b>Play the game</b><span>4th quarter, 2:30 left, down by four</span></a>
  <a class="btn" href="mockups/mobile/season-trail.html"><b>Season Trail</b><span>Prototype of the season map</span></a>
  <a class="btn" href="mockups/mobile/mobile-ui.html"><b>Mobile UI directions</b><span>The three mockups</span></a>
</main>
</body>
</html>
